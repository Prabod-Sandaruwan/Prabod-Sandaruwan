<svg xmlns="http://www.w3.org/2000/svg" width="495" height="165" viewBox="0 0 495 165" role="img" aria-labelledby="title desc">
  <title id="title">Prabod's GitHub stats</title>
  <desc id="desc">A static profile card for GitHub stats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="494" height="164" rx="12" fill="url(#bg)" stroke="#00F5D4" stroke-opacity="0.22"/>
  <text x="24" y="38" fill="#E6EDF3" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Prabod's GitHub stats</text>
  <text x="24" y="62" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="12">prabod-sandaruwan</text>

  <g transform="translate(24 86)">
    <rect width="130" height="56" rx="10" fill="#161B22" stroke="#00F5D4" stroke-opacity="0.18"/>
    <text x="16" y="22" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="11">Public repos</text>
    <text x="16" y="42" fill="#E6EDF3" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">1</text>
  </g>

  <g transform="translate(168 86)">
    <rect width="130" height="56" rx="10" fill="#161B22" stroke="#00F5D4" stroke-opacity="0.18"/>
    <text x="16" y="22" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="11">Followers</text>
    <text x="16" y="42" fill="#E6EDF3" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">1</text>
  </g>

  <g transform="translate(312 86)">
    <rect width="159" height="56" rx="10" fill="#161B22" stroke="#00F5D4" stroke-opacity="0.18"/>
    <text x="16" y="22" fill="#8B949E" font-family="Segoe UI, Arial, sans-serif" font-size="11">Focus</text>
    <text x="16" y="42" fill="#E6EDF3" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Web development</text>
  </g>
</svg>
